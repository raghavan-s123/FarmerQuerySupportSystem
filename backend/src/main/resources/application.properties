server.port=8080

# ---------- MySQL Database ----------
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/chatbot
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto create/update tables from our Entity classes (great for beginners)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- JWT ----------
app.jwt.secret=krishimitra-super-secret-key-change-this-in-production-2026
app.jwt.expiration-ms=86400000

# ---------- Python AI Service ----------
ai.service.base-url=http://localhost:8000

# ---------- Weather API (OpenWeatherMap) ----------
weather.api.key=f3c5572aa3f97e55473a7aaf4b08e62d
weather.api.base-url=https://api.openweathermap.org/data/2.5/weather

# ---------- File Upload ----------
app.upload.dir=uploads/disease-images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
